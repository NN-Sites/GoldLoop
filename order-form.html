<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>תשלום עבור המוצר - GoldLoop</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      direction: rtl;
    }
    .form-container {
      max-width: 500px;
      margin: 100px auto;
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #2d2d2d;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
    }
    input[readonly] {
      background-color: #e9e9e9;
      cursor: not-allowed;
      color: #555;
    }
    .pay-button {
      display: block;
      width: 100%;
      padding: 16px;
      background-color: #27ae60;
      color: white;
      font-size: 1.1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      text-align: center;
      text-decoration: none;
    }
    .pay-button:hover {
      background-color: #219150;
    }
    .footer {
      text-align: center;
      font-size: 0.9rem;
      color: #aaa;
      margin-top: 40px;
    }
    select#engraving {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #ccc;
      border-radius: 8px;
      background-color: #fff;
      font-size: 1rem;
      font-family: inherit;
      color: #333;
      cursor: pointer;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      box-sizing: border-box;
      appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%23333" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
    }
    select#engraving:hover,
    select#engraving:focus {
      border-color: #27ae60;
      box-shadow: 0 0 6px rgba(39, 174, 96, 0.6);
      outline: none;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>כמעט סיימנו!</h2>

  <form id="orderForm" action="https://formcarry.com/s/V2izefrqJFM" method="POST" novalidate>
    
    <label for="selectedColor">צבע הטבעת שנבחר:</label>
    <input type="text" id="selectedColor" name="צבע הטבעת" readonly value="זהב" />

    <label for="name">שם מלא:</label>
    <input type="text" id="name" name="שם מלא" required />

    <label for="email">אימייל:</label>
    <input type="email" id="email" name="אימייל" required />

    <label for="phone">טלפון:</label>
    <input type="tel" id="phone" name="טלפון" required />

    <label for="address">כתובת:</label>
    <input type="text" id="address" name="כתובת" required />
     
    <label for="details">חריטה:</label>
    <textarea id="details" name="פרטים נוספים" rows="1"></textarea>
    
    <label for="engraving">מידה</label>
    <select id="engraving" name="חריטה" required>
      <option value="" disabled selected>בחר מידה</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
      <option value="11">11</option>
      <option value="12">12</option>
      <option value="13">13</option>
    </select>

    <button type="submit" id="payBtn" class="pay-button">בצע הזמנה - נחזור אליך בהקדם.</button>
  </form>
</div>

<div class="footer">
  © כל הזכויות שמורות לחנות GoldLoop
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const color = params.get('color') || 'זהב';
    const colorInput = document.getElementById('selectedColor');
    if (colorInput) {
      colorInput.value = color;
    }
  });
</script>

</body>
</html>
